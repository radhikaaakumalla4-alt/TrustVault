
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrustVault - Admin Document Viewer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fff0f5, #ffe0eb);
            min-height: 100vh;
            color: #70203f;
        }

        header {
            background: linear-gradient(100deg, #a51e55, #d94b83);
            color: white;
            padding: 22px 35px;
        }

        header h2 {
            font-size: 25px;
        }

        .main {
            max-width: 1100px;
            margin: 35px auto;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(150, 40, 85, 0.1);
        }

        h2 {
            color: #a51e55;
            margin-bottom: 20px;
        }

        .back {
            display: inline-block;
            background: #a51e55;
            color: white;
            padding: 12px 22px;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .back:hover {
            background: #d94b83;
        }

        .document {
            width: 100%;
            height: 650px;
            border: 1px solid #f6ccda;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <header>
        <h2>🛡️ TrustVault - Admin Document Viewer</h2>
    </header>

    <div class="main">
        <div class="container">

            <a href="/admin_permissions" class="back">
                ← Back to Permissions
            </a>

            <h2>{{ document[1] }}</h2>

            <iframe
                class="document"
                src="{{ url_for('admin_document_file', document_id=document[2]) }}">
            </iframe>

        </div>
    </div>

</body>
</html>
