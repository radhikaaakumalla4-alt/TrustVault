
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrustVault - Admin Documents</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fff0f5, #ffe0eb);
            min-height: 100vh;
            color: #70203f;
        }

        header {
            background: linear-gradient(100deg, #a51e55, #d94b83);
            color: white;
            padding: 25px 40px;
        }

        header h1 {
            font-size: 27px;
        }

        .main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(150, 40, 85, 0.1);
            overflow-x: auto;
        }

        h2 {
            color: #a51e55;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th {
            background: #a51e55;
            color: white;
            padding: 15px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #f4c9d9;
        }

        tr:hover {
            background: #fff4f8;
        }

        .delete {
            background: #dc3545;
            color: white;
            padding: 9px 15px;
            text-decoration: none;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .delete:hover {
            background: #b02a37;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            background: #a51e55;
            color: white;
            padding: 12px 22px;
            text-decoration: none;
            border-radius: 8px;
        }

        .back:hover {
            background: #d94b83;
        }

        .empty {
            padding: 20px;
            color: #a51e55;
        }
    </style>
</head>

<body>

<header>
    <h1>🛡️ TrustVault - Admin Documents</h1>
</header>

<div class="main">
    <div class="container">

        <h2>📁 All Uploaded Documents</h2>

        {% if documents %}

        <table>
            <tr>
                <th>Document ID</th>
                <th>Document Name</th>
                <th>Owner</th>
                <th>Upload Date</th>
                <th>Action</th>
            </tr>

            {% for doc in documents %}
            <tr>
                <td>{{ doc[0] }}</td>
                <td>{{ doc[1] }}</td>
                <td>{{ doc[2] }}</td>
                <td>{{ doc[3] }}</td>
                <td>
                    <form action="/delete_document/{{ doc[0] }}"
                          method="POST"
                          onsubmit="return confirm('Are you sure you want to delete this document?');">

                        <button type="submit" class="delete">
                            Delete
                        </button>

                    </form>
                </td>
            </tr>
            {% endfor %}

        </table>

        {% else %}

        <p class="empty">No documents uploaded yet.</p>

        {% endif %}

        <a href="/admin" class="back">← Back to Admin Dashboard</a>

    </div>
</div>

</body>
</html>
