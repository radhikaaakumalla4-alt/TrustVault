
<!DOCTYPE html>
<html>
<head>
    <title>TrustVault - My Documents</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f3e8ff, #e4d5ff);
            min-height: 100vh;
            color: #30204d;
        }

        header {
            background: linear-gradient(100deg, #4b0082, #8a2be2);
            color: white;
            padding: 22px 35px;
            text-align: center;
        }

        header h1 {
            color: white;
            font-size: 30px;
        }

        .container {
            background: white;
            margin: 40px 30px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(75, 0, 130, 0.15);
        }

        h2 {
            color: #4b0082;
            font-size: 28px;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border: 1px solid #e6d5ff;
            border-radius: 12px;
            overflow: hidden;
        }

        th {
            background: linear-gradient(100deg, #4b0082, #8a2be2);
            color: white;
            padding: 18px;
            font-size: 18px;
            text-align: left;
        }

        td {
            padding: 16px;
            font-size: 17px;
            border-bottom: 1px solid #e6d5ff;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background: #f8f1ff;
        }

        .download-btn {
            display: inline-block;
            background: #8a2be2;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .download-btn:hover {
            background: #4b0082;
        }

        .empty {
            background: #faf6ff;
            padding: 25px;
            border-radius: 10px;
            color: #655477;
            font-size: 17px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 13px 22px;
            border: 1px solid #8a2be2;
            border-radius: 9px;
            color: #6a0dad;
            text-decoration: none;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #f3e8ff;
        }

        @media (max-width: 700px) {
            .container {
                margin: 15px;
                padding: 18px;
                overflow-x: auto;
            }

            table {
                min-width: 550px;
            }

            header {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🛡️ TrustVault - My Documents</h1>
    </header>

    <div class="container">

        <h2>📁 My Uploaded Documents</h2>

        {% if documents %}

        <table>
            <tr>
                <th>Document Name</th>
                <th>Upload Date</th>
                <th>Download</th>
            </tr>

            {% for document in documents %}
            <tr>
                <td>{{ document[1] }}</td>
                <td>{{ document[2] }}</td>
                <td>
                    <a href="/download/{{ document[0] }}" class="download-btn">
                        Download
                    </a>
                </td>
            </tr>
            {% endfor %}

        </table>

        {% else %}

        <p class="empty">No documents uploaded yet.</p>

        {% endif %}

        <a href="/owner" class="back-btn">
            Back to Owner Dashboard
        </a>

    </div>

</body>
</html>
